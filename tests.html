<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interlinked tests</title></head>
<body style="margin:0;font:14px monospace;color:#fff;background:#222">
<pre id="out" style="margin:0;padding:8px;white-space:pre-wrap"></pre>
<script type="module">
import { createDebug } from './core-debug.js';
import { versionString } from './version.js';
const dbg = createDebug();
const out = document.getElementById('out');
try {
  const { run } = await import('./test-index.js');
  const r = run();
  out.textContent = versionString() + '\n' + r.lines.join('\n');
  document.body.style.background = r.ok ? '#0a4a1a' : '#6a1010';
} catch (e) {
  out.textContent = String((e && e.stack) || e);
  document.body.style.background = '#6a1010';
}
dbg.report(out.textContent);
</script></body></html>
